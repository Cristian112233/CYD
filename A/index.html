<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuestro Álbum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdeef0;
    --bg-2: #fbe1e6;
    --paper: #fffaf7;
    --ink: #5a3a40;
    --ink-soft: #9a7479;
    --pink: #f08aa0;
    --pink-deep: #e0667f;
    --gold: #c9a14a;
    --shadow: 0 10px 30px -12px rgba(160, 70, 90, .35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Fredoka", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 10%, #fff 0 2px, transparent 3px) 0 0 / 46px 46px,
      radial-gradient(circle at 70% 60%, #f7c9d3 0 2px, transparent 3px) 0 0 / 60px 60px,
      linear-gradient(180deg, var(--bg), var(--bg-2));
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    text-align: center;
    padding: 56px 16px 12px;
  }
  .flags { font-size: 28px; letter-spacing: 6px; }
  h1 {
    font-family: "Caveat", cursive;
    font-weight: 700;
    font-size: clamp(44px, 9vw, 76px);
    margin: 4px 0 0;
    color: var(--pink-deep);
    line-height: 1;
  }
  .sub {
    color: var(--ink-soft);
    margin-top: 10px;
    font-size: 17px;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 16px 80px;
  }

  /* Tarjeta principal (primer recuerdo) */
  .hero {
    background: var(--paper);
    border-radius: 6px;
    padding: 18px 18px 22px;
    box-shadow: var(--shadow);
    transform: rotate(-1.2deg);
    max-width: 820px;
    margin: 0 auto 56px;
    position: relative;
    cursor: zoom-in;
    transition: transform .3s ease;
  }
  .hero:hover { transform: rotate(0deg) scale(1.01); }
  .hero img {
    width: 100%;
    display: block;
    border-radius: 3px;
  }
  .hero .caption {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 14px;
    font-family: "Caveat", cursive;
  }
  .hero .caption strong { font-size: 32px; color: var(--pink-deep); }
  .hero .caption span { font-size: 24px; color: var(--ink-soft); }
  .tape {
    position: absolute;
    width: 120px; height: 32px;
    background: rgba(255, 214, 224, .75);
    top: -14px; left: 50%;
    transform: translateX(-50%) rotate(-3deg);
    box-shadow: 0 2px 4px rgba(0,0,0,.06);
  }

  .section-title {
    font-family: "Caveat", cursive;
    font-size: 40px;
    text-align: center;
    color: var(--ink);
    margin: 0 0 24px;
  }

  /* Cuadrícula de polaroids */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 34px 26px;
  }
  .card {
    background: var(--paper);
    padding: 12px 12px 16px;
    border-radius: 4px;
    box-shadow: var(--shadow);
    position: relative;
    transition: transform .25s ease;
    cursor: zoom-in;
  }
  .card:nth-child(3n+1) { transform: rotate(-2deg); }
  .card:nth-child(3n+2) { transform: rotate(1.5deg); }
  .card:nth-child(3n)   { transform: rotate(-.5deg); }
  .card:hover { transform: rotate(0) translateY(-4px); z-index: 2; }
  .card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    border-radius: 2px;
    background: var(--bg-2);
  }
  .card .title {
    font-family: "Caveat", cursive;
    font-size: 26px;
    margin-top: 10px;
    line-height: 1.1;
  }
  .card .date { color: var(--ink-soft); font-size: 14px; margin-top: 2px; }
  .card .del {
    position: absolute;
    top: 6px; right: 6px;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.9);
    color: var(--pink-deep);
    font-size: 18px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .2s;
  }
  .card:hover .del, .card:focus-within .del { opacity: 1; }
  @media (hover: none) { .card .del { opacity: 1; } }

  .add {
    border: 3px dashed var(--pink);
    background: rgba(255,255,255,.5);
    border-radius: 6px;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--pink-deep);
    font: inherit;
    font-size: 18px;
    cursor: pointer;
    transition: background .2s, transform .2s;
  }
  .add:hover { background: #fff; transform: translateY(-3px); }
  .add .plus { font-size: 54px; line-height: 1; }

  /* Modal para agregar */
  dialog {
    border: none;
    border-radius: 14px;
    padding: 0;
    width: min(440px, calc(100vw - 32px));
    background: var(--paper);
    color: var(--ink);
    box-shadow: 0 30px 80px -20px rgba(120,40,60,.5);
  }
  dialog::backdrop { background: rgba(90, 40, 55, .45); }
  .form { padding: 24px; display: grid; gap: 14px; }
  .form h3 { margin: 0; font-family: "Caveat", cursive; font-size: 34px; color: var(--pink-deep); }
  .form label { display: grid; gap: 6px; font-size: 14px; color: var(--ink-soft); }
  .form input[type=text], .form input[type=date] {
    font: inherit; color: var(--ink);
    padding: 10px 12px;
    border: 1.5px solid #f2c6cf;
    border-radius: 8px;
    background: #fff;
  }
  .preview {
    width: 100%; aspect-ratio: 1/1; object-fit: cover;
    border-radius: 8px; display: none; background: var(--bg-2);
  }
  .actions { display: flex; justify-content: flex-end; gap: 10px; }
  .btn {
    font: inherit; border: none; border-radius: 999px;
    padding: 10px 20px; cursor: pointer;
  }
  .btn.primary { background: var(--pink-deep); color: #fff; }
  .btn.primary:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: transparent; color: var(--ink-soft); }

  /* Visor */
  .viewer {
    position: fixed; inset: 0;
    background: rgba(60, 25, 35, .85);
    display: none;
    align-items: center; justify-content: center;
    padding: 16px;
    z-index: 50;
    cursor: zoom-out;
  }
  .viewer.open { display: flex; }
  .viewer figure { margin: 0; text-align: center; color: #fff; }
  .viewer img { max-width: 100%; max-height: 82vh; border-radius: 6px; }
  .viewer figcaption { font-family: "Caveat", cursive; font-size: 30px; margin-top: 10px; }

  .empty-note { text-align: center; color: var(--ink-soft); margin-top: 12px; }

  footer {
    text-align: center;
    color: var(--ink-soft);
    padding: 0 16px 40px;
    font-size: 15px;
  }

  /* Corazones flotando */
  .heart {
    position: fixed; bottom: -30px;
    color: var(--pink);
    pointer-events: none;
    animation: float linear forwards;
    opacity: .7;
    z-index: 0;
  }
  @keyframes float {
    to { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .heart { display: none; } }
  header, main, footer { position: relative; z-index: 1; }
</style>
</head>
<body>

<header>
  <div class="flags" aria-label="México y Filipinas">🇲🇽 💕 🇵🇭</div>
  <h1>Nuestro Álbum</h1>
  <div class="sub">Cada mes juntos, un recuerdo más</div>
</header>

<main>
  <article class="hero" id="hero" tabindex="0">
    <div class="tape"></div>
    <img src="aaa.jpeg" alt="Ilustración de la pareja tomada de la mano con las banderas de México y Filipinas">
    <div class="caption">
      <strong>Nuestro primer mes 💗</strong>
      <span>Happy 1st Monthsary</span>
    </div>
  </article>

  <h2 class="section-title">Nuestros recuerdos</h2>
  <div class="grid" id="grid">
    <button class="add" id="addBtn" type="button">
      <span class="plus">+</span>
      Agregar recuerdo
    </button>
  </div>
  <p class="empty-note" id="emptyNote">Agrega su primera foto juntos ✨</p>
</main>

<footer>Hecho con amor · de México a Filipinas</footer>

<dialog id="dlg">
  <form class="form" method="dialog" id="form">
    <h3>Nuevo recuerdo</h3>
    <label>Foto
      <input type="file" accept="image/*" id="file" required>
    </label>
    <img class="preview" id="preview" alt="">
    <label>Título
      <input type="text" id="title" placeholder="Nuestra primera cita…" maxlength="60">
    </label>
    <label>Fecha
      <input type="date" id="date">
    </label>
    <div class="actions">
      <button class="btn ghost" type="button" id="cancel">Cancelar</button>
      <button class="btn primary" type="submit" id="save" disabled>Guardar</button>
    </div>
  </form>
</dialog>

<div class="viewer" id="viewer">
  <figure>
    <img id="viewerImg" alt="">
    <figcaption id="viewerCap"></figcaption>
  </figure>
</div>

<script>
// ---------- Almacenamiento (IndexedDB, solo en este navegador) ----------
const DB_NAME = "album-pareja", STORE = "fotos";
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: "id" });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function tx(mode, fn) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const t = db.transaction(STORE, mode);
    const out = fn(t.objectStore(STORE));
    t.oncomplete = () => res(out && out.result);
    t.onerror = () => rej(t.error);
  });
}
const getAll = () => tx("readonly", s => s.getAll()).catch(() => []);
const put    = item => tx("readwrite", s => s.put(item));
const remove = id => tx("readwrite", s => s.delete(id));

// ---------- Render ----------
const grid = document.getElementById("grid");
const addBtn = document.getElementById("addBtn");
const emptyNote = document.getElementById("emptyNote");
const urls = [];

function fmtDate(d) {
  if (!d) return "";
  const [y, m, day] = d.split("-").map(Number);
  return new Date(y, m - 1, day).toLocaleDateString("es-MX", { day: "numeric", month: "long", year: "numeric" });
}

async function render() {
  urls.forEach(URL.revokeObjectURL); urls.length = 0;
  grid.querySelectorAll(".card").forEach(c => c.remove());
  const items = (await getAll()).sort((a, b) => (a.date || "").localeCompare(b.date || "") || a.id - b.id);
  emptyNote.style.display = items.length ? "none" : "block";
  for (const it of items) {
    const url = URL.createObjectURL(it.blob); urls.push(url);
    const card = document.createElement("article");
    card.className = "card";
    card.tabIndex = 0;
    card.innerHTML = `
      <img alt="">
      <div class="title"></div>
      <div class="date"></div>
      <button class="del" type="button" aria-label="Eliminar">×</button>`;
    card.querySelector("img").src = url;
    card.querySelector("img").alt = it.title || "Recuerdo";
    card.querySelector(".title").textContent = it.title || "Un recuerdo 💕";
    card.querySelector(".date").textContent = fmtDate(it.date);
    card.addEventListener("click", e => {
      if (e.target.closest(".del")) return;
      openViewer(url, it.title || "");
    });
    card.querySelector(".del").addEventListener("click", async () => {
      if (confirm("¿Eliminar este recuerdo?")) { await remove(it.id); render(); }
    });
    grid.insertBefore(card, addBtn);
  }
}

// ---------- Agregar ----------
const dlg = document.getElementById("dlg");
const file = document.getElementById("file");
const preview = document.getElementById("preview");
const title = document.getElementById("title");
const date = document.getElementById("date");
const save = document.getElementById("save");

addBtn.onclick = () => {
  document.getElementById("form").reset();
  preview.style.display = "none";
  save.disabled = true;
  date.value = new Date().toISOString().slice(0, 10);
  dlg.showModal();
};
document.getElementById("cancel").onclick = () => dlg.close();
file.onchange = () => {
  const f = file.files[0];
  save.disabled = !f;
  if (f) { preview.src = URL.createObjectURL(f); preview.style.display = "block"; }
};
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const f = file.files[0];
  if (!f) return;
  save.disabled = true;
  try {
    await put({ id: Date.now(), blob: f, title: title.value.trim(), date: date.value });
  } catch (err) {
    alert("No se pudo guardar la foto en este navegador.");
  }
  dlg.close();
  render();
});

// ---------- Visor ----------
const viewer = document.getElementById("viewer");
function openViewer(src, cap) {
  document.getElementById("viewerImg").src = src;
  document.getElementById("viewerCap").textContent = cap;
  viewer.classList.add("open");
}
viewer.onclick = () => viewer.classList.remove("open");
document.addEventListener("keydown", e => { if (e.key === "Escape") viewer.classList.remove("open"); });
const hero = document.getElementById("hero");
hero.onclick = () => openViewer("aaa.jpeg", "Happy 1st Monthsary 💗");
hero.onkeydown = e => { if (e.key === "Enter") hero.click(); };

// ---------- Corazones ----------
function spawnHeart() {
  const h = document.createElement("div");
  h.className = "heart";
  h.textContent = Math.random() > .5 ? "♥" : "❀";
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = 12 + Math.random() * 18 + "px";
  h.style.animationDuration = 8 + Math.random() * 8 + "s";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 17000);
}
setInterval(spawnHeart, 1400);

render();
</script>
</body>
</html>
